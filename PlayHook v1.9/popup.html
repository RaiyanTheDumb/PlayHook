<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --accent: #2f6fed;
    --border-c: #d9dde3;
    --muted: #8a8f98;
    --hover: #f2f4f7;
  }
  body {
    width: 250px;
    font-family: -apple-system, Arial, sans-serif;
    padding: 12px;
    margin: 0;
    color: #1f2430;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 9px;
    margin-bottom: 10px;
    border-bottom: 2px solid var(--accent);
  }
  .brand img {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .brand span {
    font-size: 15px;
    font-weight: 700;
    color: #1f2430;
    letter-spacing: -0.2px;
  }

  .card {
    border: 1px solid var(--border-c);
    border-radius: 10px;
    padding: 6px;
    margin-bottom: 10px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 4px;
    border-radius: 7px;
    cursor: pointer;
    user-select: none;
  }
  .row:hover { background: var(--hover); }
  .row.disabled { opacity: 0.4; pointer-events: none; }
  .row-icon { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
  .inline-icon { width: 12px; height: 12px; vertical-align: -1px; color: var(--muted); }
  .row span { font-size: 11.5px; flex: 1; }
  .row input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }

  .divider {
    height: 1px;
    background: var(--border-c);
    margin: 2px 4px;
  }

  /* ---------- Keyhole seek slider ---------- */
  .seek-block { padding: 8px 4px 4px; }
  .seek-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .seek-top i { font-size: 14px; color: var(--muted); }
  .seek-top .val { font-weight: 600; color: #1f2430; font-size: 11px; }

  .seek-slider-wrap {
    position: relative;
    padding-top: 22px;
    padding-bottom: 4px;
  }
  .seek-tooltip {
    position: absolute;
    top: -2px;
    transform: translateX(-50%);
    background: #1f2430;
    color: #fff;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 5px;
    white-space: nowrap;
    pointer-events: none;
  }
  .seek-tooltip::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top-color: #1f2430;
  }

  input[type="range"].keyhole-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 50%), #e2e5ea var(--fill, 50%), #e2e5ea 100%);
    outline: none;
    margin: 0;
  }
  input[type="range"].keyhole-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 24px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='24' viewBox='0 0 20 24'><circle cx='10' cy='8' r='6.5' fill='%232f6fed' stroke='white' stroke-width='2'/><path d='M7.5 13 L12.5 13 L11 21 L9 21 Z' fill='%232f6fed' stroke='white' stroke-width='1.5' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
  }
  input[type="range"].keyhole-slider::-moz-range-thumb {
    width: 20px;
    height: 24px;
    border: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='24' viewBox='0 0 20 24'><circle cx='10' cy='8' r='6.5' fill='%232f6fed' stroke='white' stroke-width='2'/><path d='M7.5 13 L12.5 13 L11 21 L9 21 Z' fill='%232f6fed' stroke='white' stroke-width='1.5' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
  }
  input[type="range"].keyhole-slider::-moz-range-track {
    height: 4px;
    border-radius: 3px;
    background: #e2e5ea;
  }
  .seek-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: #b0b4bb;
    margin-top: 1px;
  }

  /* ---------- Collapsible shortcuts ---------- */
  .shortcuts-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    padding: 6px 4px;
    user-select: none;
  }
  .shortcuts-toggle .left { display: flex; align-items: center; gap: 6px; }
  .lead-icon { width: 14px; height: 14px; color: var(--accent); }
  .shortcuts-toggle span.label { font-size: 12px; font-weight: 500; }
  .chev { width: 13px; height: 13px; color: var(--muted); transition: transform 0.15s ease; }
  .shortcuts-toggle.open .chev { transform: rotate(180deg); }
  .shortcuts-hint { font-size: 10px; color: var(--muted); margin: 0 4px 2px; }

  .shortcuts-list {
    display: none;
    padding: 4px 4px 2px;
  }
  .shortcuts-list.open { display: block; }
  .sc-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
    font-size: 10.5px;
  }
  .sc-row .key {
    color: #1f2430;
  }
  .sc-row .desc {
    color: var(--muted);
  }

  .hint {
    font-size: 10.5px;
    color: var(--muted);
    margin: 8px 2px 0;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="icon48.png" alt="">
    <span>PlayHook</span>
  </div>

  <div class="card">
    <label class="row" id="excludeWebsiteRow">
      <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      <span>Exclude site</span>
      <input type="checkbox" id="excludeWebsite">
    </label>
    <label class="row disabled" id="excludeWebsiteTabRow">
      <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      <span>This tab only</span>
      <input type="checkbox" id="excludeWebsiteTab">
    </label>
    <div class="divider"></div>
    <label class="row" id="pauseExtensionRow">
      <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <span>Pause all</span>
      <input type="checkbox" id="pauseExtension">
    </label>
    <label class="row disabled" id="pauseTabRow">
      <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <span>This tab only</span>
      <input type="checkbox" id="pauseTab">
    </label>
    <div class="divider"></div>
    <div class="seek-block">
      <div class="seek-top">
        <span><svg class="inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><polygon points="5,5 13,12 5,19" fill="currentColor" stroke="none"/><line x1="15" y1="5" x2="15" y2="19"/></svg> Seek</span>
        <span class="val" id="seekValLabel">10s</span>
      </div>
      <div class="seek-slider-wrap">
        <div class="seek-tooltip" id="seekTooltip">10s</div>
        <input type="range" id="seekSlider" class="keyhole-slider" min="0" max="9" step="1" value="5">
      </div>
      <div class="seek-ticks"><span>1s</span><span>10min</span></div>
    </div>
  </div>

  <div class="card">
    <div id="shortcutsHeader" style="cursor: pointer;">
      <div class="shortcuts-toggle" id="shortcutsToggle">
        <div class="left">
          <svg class="lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="10"/><line x1="10" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="14" y2="10"/><line x1="18" y1="10" x2="18" y2="10"/><line x1="7" y1="14" x2="17" y2="14"/></svg>
          <span class="label">Shortcuts</span>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6,9 12,15 18,9"/></svg>
      </div>
      <p class="shortcuts-hint" id="shortcutsHint">Tap to view all 8 shortcuts</p>
    </div>
    <div class="shortcuts-list" id="shortcutsList">
      <div class="sc-row"><span class="key">Space</span><span class="desc">Play / pause</span></div>
      <div class="sc-row"><span class="key">← / →</span><span class="desc">Seek amount</span></div>
      <div class="sc-row"><span class="key">0–9</span><span class="desc">Jump to 0–90%</span></div>
      <div class="sc-row"><span class="key">M</span><span class="desc">Mute / unmute</span></div>
      <div class="sc-row"><span class="key">F</span><span class="desc">Fullscreen</span></div>
      <div class="sc-row"><span class="key">Shift + ,</span><span class="desc">Speed −0.25×</span></div>
      <div class="sc-row"><span class="key">Shift + .</span><span class="desc">Speed +0.25×</span></div>
      <div class="sc-row"><span class="key">Speed range</span><span class="desc">0.25× – 3×</span></div>
    </div>
  </div>

  <p class="hint" id="hintText">"This tab only" options reset when you reload or leave the page.</p>

  <script src="popup.js"></script>
</body>
</html>
